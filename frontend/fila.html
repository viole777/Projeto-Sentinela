<!DOCTYPE html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="styles.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sentinela — Fila</title></head>
<body>
<script src="layout.js"></script>
<script>
Sentinela.mount("fila", `<h2>Fila de atendimento</h2><div id="lista"></div>`).then(async () => {
  const list = await fetch("/triagem").then(r => r.json());
  const ordem = { vermelho: 0, amarelo: 1, verde: 2 };
  list.sort((a, b) => (ordem[a.risco] ?? 9) - (ordem[b.risco] ?? 9));
  const rot = { vermelho: "PRIORIDADE ALTA", amarelo: "PRIORIDADE MODERADA", verde: "PRIORIDADE NORMAL" };
  const dot = { vermelho: "🔴", amarelo: "🟠", verde: "🟡" };
  document.getElementById("lista").innerHTML = list.map(t => `
    <div class="card" style="margin-bottom:8px;"><b>${dot[t.risco] || "⚪"} ${rot[t.risco] || t.risco}</b><br>
    ${t.pacienteNome} · Chegada: ${new Date(t.createdAt).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}<br>
    <button style="margin-top:6px;" onclick="sessionStorage.setItem('pacienteCpf','${t.pacienteCpf}');location.href='medico.html'">Chamar paciente</button></div>`).join("") ||
    `<div class="card" style="text-align:center;padding:24px;"><div style="font-size:28px;">✓</div><b>Nenhum paciente aguardando</b><br><small>A fila de atendimento está vazia.</small></div>`;
});
</script>
</body>
</html>
