<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinela — Login</title>
    <style>
        body {
            margin: 0;
            background: #edf1f4;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #1a2432;
        }
        .login-wrap {
            max-width: 420px;
            margin: 10vh auto;
            text-align: center;
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }
        .brand-mark {
            width: 54px;
            height: 54px;
            border-radius: 6px;
            background: #1f4a73;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 24px;
            letter-spacing: 0.08em;
        }
        .brand-name {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.14em;
            color: #1a2432;
        }
        .brand-sub {
            color: #5f6f84;
            margin-bottom: 20px;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 700;
        }
        .login-card {
            text-align: left;
            background: #ffffff;
            border: 1px solid #d8e0ea;
            border-radius: 6px;
            padding: 22px;
            box-shadow: 0 1px 0 rgba(16, 24, 40, 0.02);
        }
        .login-card label {
            display: block;
            font-size: 12px;
            margin: 12px 0 6px;
            color: #5f6f84;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 44px; }
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #1f4a73;
            cursor: pointer;
            font-size: 12px;
            padding: 4px;
            font-weight: 700;
        }
        .row-links {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 13px;
        }
        .row-links a { color: #1f4a73; text-decoration: none; }
        .secure {
            margin-top: 18px;
            font-size: 12px;
            color: #5f6f84;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .err {
            color: #b63c3c;
            font-size: 13px;
            margin-top: 10px;
            min-height: 18px;
        }
    </style>
</head>
<body>
    <div class="container login-wrap">
        <div class="brand">
            <div class="brand-mark">S</div>
        </div>
        <div class="brand-name">SENTINELA</div>
        <div class="brand-sub">Sistema Hospitalar de Cardiologia</div>
        <div class="card login-card">
            <label for="email">E-mail institucional</label>
            <input id="email" type="email" placeholder="usuario@hospital..." autocomplete="username">
            <label for="senha">Senha</label>
            <div class="password-wrap">
                <input id="senha" type="password" placeholder="••••••••••••" autocomplete="current-password">
                <button type="button" class="password-toggle" id="toggleSenha">Mostrar</button>
            </div>
            <div class="err" id="err"></div>
            <button id="loginBtn" style="width:100%; margin-top:6px;" onclick="login()">Entrar</button>
            <div class="row-links">
                <a href="recuperar-senha.html">Esqueci minha senha</a>
                <a href="primeiro-acesso.html">Primeiro acesso</a>
            </div>
        </div>
        <div class="secure">Ambiente protegido</div>
    </div>
    <script>
        // Se já logado, vai direto ao dashboard do seu cargo
        fetch("/me").then(r => { if (r.ok) location.href = "dashboard.html"; }).catch(() => {});
        function dashboardFor(role) {
            return "dashboard.html"; // dashboard único que se adapta ao cargo
        }
        async function login() {
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const err = document.getElementById('err');
            const btn = document.getElementById('loginBtn');
            err.textContent = "";
            if (!email || !senha) { err.textContent = "Informe e-mail e senha para entrar."; return; }
            btn.disabled = true;
            btn.textContent = "Entrando...";
            try {
                const r = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, usuario: email, senha })
                });
                const data = await r.json().catch(() => ({}));
                if (r.status === 403 && data.erro === "primeiro_acesso") {
                    sessionStorage.setItem("primeiroAcessoId", data.usuarioId);
                    location.href = "primeiro-acesso.html";
                    return;
                }
                if (!r.ok) {
                    err.textContent = data.erro || "Não foi possível entrar no sistema. Tente novamente.";
                    return;
                }
                sessionStorage.setItem("sentinelaRole", data.role || data.tipo);
                sessionStorage.setItem("sentinelaNome", data.nome || data.usuario);
                location.href = dashboardFor(data.role || data.tipo);
            } catch (e) {
                err.textContent = "Servidor indisponível. Tente novamente em instantes.";
            } finally {
                btn.disabled = false;
                btn.textContent = "Entrar";
            }
        }
        document.getElementById('senha').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
        document.getElementById('toggleSenha').addEventListener('click', () => {
            const senhaField = document.getElementById('senha');
            const isHidden = senhaField.type === 'password';
            senhaField.type = isHidden ? 'text' : 'password';
            document.getElementById('toggleSenha').textContent = isHidden ? 'Ocultar' : 'Mostrar';
        });
    </script>
</body>
</html>
