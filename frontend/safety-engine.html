<!DOCTYPE html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="styles.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sentinela — Safety Engine</title></head>
<body>
<script src="layout.js"></script>
<script>
Sentinela.mount("safety", `
  <div class="page-header">
    <div><div class="eyebrow">Governança clínica</div><h1>Safety Engine</h1><div class="dashboard-context">Regras que orientam os alertas de segurança do sistema.</div></div>
    <div class="header-meta"><span class="admin-mark">Somente administrador</span></div>
  </div>

  <div class="access-note">
    <div class="admin-mark">Admin</div>
    <div><strong>Área de governança.</strong><br><span>O Safety Engine não diagnostica nem prescreve. Ele aplica regras configuradas pelo administrador e sinaliza situações que precisam de revisão profissional.</span></div>
  </div>

  <section class="panel" style="margin-top:16px;">
    <div class="panel-title">Regras ativas</div>
    <div id="regras"></div>
    <div class="row-actions" style="margin-top:14px;"><button id="salvarRegras">Salvar regras</button><span id="status" class="dashboard-note"></span></div>
  </section>

  <section class="panel" style="margin-top:16px;">
    <div class="panel-title">Ocorrências em aberto</div>
    <div id="hist" class="list"></div>
  </section>
`).then(async () => {
  const esc = Sentinela.escapeHtml;
  const names = {
    alergia:["Alergia × medicação","Verifica conflitos entre alergias registradas e medicamentos."],
    altoRisco:["Medicamentos de alto risco","Sinaliza itens classificados como de maior risco operacional."],
    duplicidade:["Duplicidade de medicação","Procura possíveis repetições na prescrição."],
    dadosIncompletos:["Dados clínicos incompletos","Aponta informações essenciais ausentes."],
    sinalCritico:["Sinais clínicos críticos","Destaca sinais que merecem revisão imediata."]
  };

  const rulesRes = await fetch("/safety/regras");
  if (!rulesRes.ok) {
    document.getElementById("status").textContent = "Acesso às regras foi recusado.";
    return;
  }
  const rules = await rulesRes.json();
  const keys = Object.keys(names).filter(k => Object.prototype.hasOwnProperty.call(rules,k));

  document.getElementById("regras").innerHTML = keys.map(key => `
    <div class="rule-row">
      <div class="rule-copy"><strong>${names[key][0]}</strong><small>${names[key][1]}</small></div>
      <label class="switch"><input id="rule-${key}" type="checkbox" ${rules[key] !== false ? "checked" : ""}><span class="switch-track"></span></label>
    </div>
  `).join("");

  document.getElementById("salvarRegras").onclick = async () => {
    const payload = {};
    keys.forEach(key => payload[key] = document.getElementById("rule-" + key).checked);
    const res = await fetch("/safety/regras", {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    document.getElementById("status").textContent = res.ok ? "Regras atualizadas." : "Alteração recusada.";
  };

  const historyRes = await fetch("/alertas?abertos=1");
  const alerts = historyRes.ok ? await historyRes.json() : [];
  document.getElementById("hist").innerHTML = (alerts || []).slice(0,20).map(a => `
    <div class="list-item">
      <div class="meta-row"><span class="badge ${String(a.nivel).toUpperCase() === "CRITICO" ? "critica" : String(a.nivel).toUpperCase() === "ALTO" ? "alta" : "info"}">${esc(a.nivel || "INFO")}</span><span class="meta-chip">${esc(a.regra || "sistema")}</span></div>
      <strong>${esc(a.mensagem || "Ocorrência registrada")}</strong><small>${esc(a.pacienteNome || "Sistema")} · ${esc(a.pacienteCpf || "-")}</small>
    </div>
  `).join("") || '<div class="empty-state">Nenhuma ocorrência em aberto.</div>';
});
</script>
</body>
</html>
