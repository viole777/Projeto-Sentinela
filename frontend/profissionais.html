<!DOCTYPE html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="styles.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sentinela — Profissionais</title></head>
<body>
<script src="layout.js"></script>
<script>
Sentinela.mount("profissionais", `
  <h2>Profissionais</h2>
  <div class="card"><h3>+ Novo profissional</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <input id="usuario" placeholder="Usuário" style="max-width:160px;"><input id="nome" placeholder="Nome" style="max-width:200px;">
      <input id="email" placeholder="E-mail institucional" style="max-width:220px;">
      <input id="setor" placeholder="Setor" style="max-width:180px;">
      <select id="role" style="max-width:180px;">
        <option value="medico">Médico</option><option value="cardiologist">Cardiologista</option>
        <option value="enfermagem">Enfermagem</option><option value="farmacia">Farmácia</option>
        <option value="triagem">Triagem</option><option value="atendimento">Atendimento</option>
        <option value="recepcao">Recepção</option><option value="direcao">Direção</option><option value="admin">Admin</option>
      </select>
      <button onclick="criar()">Criar (primeiro acesso)</button>
    </div></div>
  <div class="card" style="margin-top:12px;"><table class="tbl"><thead><tr><th>Nome</th><th>Cargo</th><th>Setor</th><th>E-mail</th></tr></thead><tbody id="tb"></tbody></table></div>
`).then(() => {
  window.criar = async () => {
    const usuario = document.getElementById("usuario").value.trim();
    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();
    const setor = document.getElementById("setor").value.trim();
    const role = document.getElementById("role").value;
    if (!usuario || !nome || !role) {
      alert("Preencha usuário, nome e cargo.");
      return;
    }
    const r = await fetch("/profissionais", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usuario, nome, email, setor, role }) });
    if (!r.ok) { alert("Não foi possível criar o profissional. Verifique os dados e suas permissões."); return; }
    alert("Profissional criado. Ele deverá definir a própria senha no primeiro acesso.");
    document.getElementById("usuario").value = "";
    document.getElementById("nome").value = "";
    document.getElementById("email").value = "";
    document.getElementById("setor").value = "";
    await carregar();
  };
  async function carregar() {
    const response = await fetch("/profissionais", { headers: { "Accept": "application/json" } });
    const tbody = document.getElementById("tb");
    tbody.replaceChildren();
    if (!response.ok) {
      const row = document.createElement("tr");
      const cell = document.createElement("td");
      cell.colSpan = 4;
      cell.textContent = "Não foi possível carregar os profissionais.";
      row.appendChild(cell);
      tbody.appendChild(row);
      return;
    }
    const list = await response.json();
    if (!Array.isArray(list) || list.length === 0) {
      const row = document.createElement("tr");
      const cell = document.createElement("td");
      cell.colSpan = 4;
      cell.textContent = "Nenhum profissional cadastrado.";
      row.appendChild(cell);
      tbody.appendChild(row);
      return;
    }
    list.forEach(p => {
      const row = document.createElement("tr");
      [p.nome, p.role, p.setor || "-", p.email || "-"].forEach(value => {
        const cell = document.createElement("td");
        cell.textContent = value == null ? "" : String(value);
        row.appendChild(cell);
      });
      tbody.appendChild(row);
    });
  }
  carregar();
});
</script>
</body>
</html>
