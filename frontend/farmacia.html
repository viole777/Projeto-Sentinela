<!DOCTYPE html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="styles.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sentinela — Farmácia</title></head>
<body>
<script src="layout.js"></script>
<script>
Sentinela.mount("farmacia", `
  <div class="page-header">
    <div>
      <div class="eyebrow">Farmácia</div>
      <h1>Prescrições</h1>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Resumo</div>
    <div class="panel-grid" id="kpis"></div>
  </div>

  <div class="section">
    <div class="panel-title">Pendentes</div>
    <div id="lista" class="list"></div>
  </div>
`).then(() => {
  async function carregar() {
    const list = await fetch("/farmacia/prescricoes").then(r => r.json());
    const crit = list.filter(p => (p.safety || []).some(s => s.nivel === "CRITICO")).length;

    document.getElementById("kpis").innerHTML = `
      <div class="kpi"><b>${list.length}</b><span>Pendentes</span></div>
      <div class="kpi"><b>${crit}</b><span>Com alerta crítico</span></div>
    `;

    document.getElementById("lista").innerHTML = list.length
      ? list.map(p => `
          <div class="list-item">
            <div class="meta-row">
              <strong>${p.pacienteNome}</strong>
              <span class="meta-chip">${p.pacienteCpf}</span>
            </div>
            <small>${p.diagnostico || "Diagnóstico não informado"}</small>
            <div style="margin-top:8px;">
              ${(p.safety || []).map(s => `<div class="meta-row" style="margin-bottom:4px;"><span class="badge ${s.nivel === 'CRITICO' ? 'critica' : s.nivel === 'ALTO' ? 'alta' : 'info'}">${s.nivel}</span><span>${s.mensagem}</span></div>`).join("") || "<small>Sem alertas de segurança.</small>"}
            </div>
            <div class="row-actions" style="margin-top:8px;">
              <button onclick="dispensar(${p.consultaId})">Dispensar</button>
            </div>
          </div>
        `).join("")
      : '<div class="empty-state">Nenhuma prescrição pendente.</div>';
  }

  window.dispensar = async (id) => {
    const r = await fetch("/farmacia/dispensar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ consultaId: id }) });
    if (r.status === 409) { const e = await r.json(); alert(e.erro); return; }
    if (!r.ok) { alert("Falha ao dispensar"); return; }
    carregar();
  };

  carregar(); setInterval(carregar, 10000);
});
</script>
</body>
</html>
