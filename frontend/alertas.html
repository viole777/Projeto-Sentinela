<!DOCTYPE html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="styles.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sentinela — Central de segurança</title></head>
<body>
<script src="layout.js"></script>
<script>
Sentinela.mount("alertas", `
  <div class="page-header">
    <div>
      <div class="eyebrow">Gestão</div>
      <h1>Alertas</h1>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Filtros</div>
    <div class="toolbar" id="filtros">
      <button class="secondary" data-f="">Todos</button>
      <button class="secondary" data-f="CRITICO">Críticos</button>
      <button class="secondary" data-f="ALTO">Altos</button>
      <button class="secondary" data-f="abertos">Abertos</button>
    </div>
  </div>

  <div class="section">
    <div class="panel-title">Ocorrências</div>
    <div id="lista" class="list"></div>
  </div>
`).then(() => {
  let f = "";
  document.querySelectorAll("#filtros button").forEach(b => b.onclick = () => { f = b.dataset.f; carregar(); });
  async function carregar() {
    const q = f === "abertos" ? "?abertos=1" : f ? "?nivel=" + f : "";
    const list = await fetch("/alertas" + q).then(r => r.json());

    const listHtml = list.length
      ? list.map(a => `
          <div class="list-item">
            <div class="meta-row">
              <span class="badge ${a.nivel === "CRITICO" ? "critica" : a.nivel === "ALTO" ? "alta" : "info"}">${a.nivel}</span>
              <span class="meta-chip">${a.regra}</span>
            </div>
            <strong>${a.mensagem}</strong>
            <small>${a.pacienteNome || "Sistema"} (${a.pacienteCpf || "-"}) · ${new Date(a.quando).toLocaleString("pt-BR")} · por ${a.geradoPor}${a.resolvido ? " · resolvido" : ""}</small>
            ${a.resolvido ? "" : `<div class="row-actions" style="margin-top:8px;"><button class="secondary" onclick=\"resolver(${a.id})\">Revisar</button></div>`}
          </div>
        `).join("")
      : '<div class="empty-state">Nenhum alerta cadastrado.</div>';

    document.getElementById("lista").innerHTML = listHtml;
  }

  window.resolver = async (id) => { await fetch("/alertas/" + id + "/resolver", { method: "POST" }); carregar(); };
  carregar(); setInterval(carregar, 10000);
});
</script>
</body>
</html>
