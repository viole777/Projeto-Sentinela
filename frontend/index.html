<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinela — Login</title>
    <style>
        :root {
            --bg: #edf2f7;
            --panel: #ffffff;
            --panel-alt: #f5f9ff;
            --text: #1a2432;
            --muted: #586a7d;
            --line: #dfe7f0;
            --brand: #1f4a73;
            --brand-strong: #173a5d;
            --brand-soft: #eaf3ff;
            --danger: #b63c3c;
            --shadow: 0 16px 40px rgba(22, 34, 52, 0.08);
        }

        body {
            margin: 0;
            background: linear-gradient(180deg, #edf2f7 0%, #e8eef7 100%);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
        }

        body[data-theme="dark"] {
            --bg: #0d1726;
            --panel: #121f31;
            --panel-alt: #182a40;
            --text: #edf4ff;
            --muted: #a7b8ce;
            --line: #253a53;
            --brand: #9ec5ff;
            --brand-strong: #b9d8ff;
            --brand-soft: #162d49;
            --danger: #ff8d8d;
            --shadow: 0 18px 44px rgba(2, 8, 18, 0.45);
            background: linear-gradient(180deg, #0d1726 0%, #0f1d2d 100%);
            color: var(--text);
        }

        .login-wrap {
            max-width: 440px;
            margin: 10vh auto;
            text-align: center;
            padding: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }

        .brand-mark {
            width: 58px;
            height: 58px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-strong) 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 24px;
            letter-spacing: 0.08em;
            box-shadow: var(--shadow);
        }

        .brand-name {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: 0.12em;
            color: var(--text);
        }

        .brand-sub {
            color: var(--muted);
            margin-bottom: 22px;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 700;
        }

        .login-card {
            text-align: left;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 24px 22px 18px;
            box-shadow: var(--shadow);
        }

        .login-card label {
            display: block;
            font-size: 11px;
            margin: 14px 0 7px;
            color: var(--muted);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .login-card input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--panel-alt);
            color: var(--text);
            padding: 12px 14px;
            font-size: 14px;
            outline: none;
        }

        .login-card input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(31, 74, 115, 0.12);
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 52px;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--brand);
            cursor: pointer;
            font-size: 12px;
            padding: 4px 6px;
            font-weight: 700;
        }

        .login-btn {
            width: 100%;
            margin-top: 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-strong) 100%);
            color: #fff;
            padding: 12px 14px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: filter .15s ease, transform .15s ease;
        }

        .login-btn:hover {
            filter: brightness(1.04);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .row-links {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin-top: 14px;
            font-size: 13px;
            flex-wrap: wrap;
        }

        .row-links a {
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
        }

        .secure {
            margin-top: 18px;
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .err {
            color: var(--danger);
            font-size: 13px;
            margin-top: 10px;
            min-height: 18px;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .login-wrap {
                margin-top: 24px;
            }

            .brand-name {
                letter-spacing: 0.08em;
                font-size: 22px;
            }

            .row-links {
                display: block;
            }

            .row-links a + a {
                display: block;
                margin-top: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container login-wrap">
        <div class="brand">
            <div class="brand-mark">S</div>
        </div>
        <div class="brand-name">SENTINELA</div>
        <div class="brand-sub">Sistema Hospitalar de Cardiologia</div>
        <div class="card login-card">
            <label for="email">Usuário ou e-mail institucional</label>
            <input id="email" type="text" placeholder="usuário ou e-mail" autocomplete="username">
            <label for="senha">Senha</label>
            <div class="password-wrap">
                <input id="senha" type="password" placeholder="••••••••••••" autocomplete="current-password">
                <button type="button" class="password-toggle" id="toggleSenha">Mostrar</button>
            </div>
            <div class="err" id="err"></div>
            <button id="loginBtn" class="login-btn" onclick="login()">Entrar</button>
            <div class="row-links">
                <a href="recuperar-senha.html">Esqueci minha senha</a>
                <a href="primeiro-acesso.html">Primeiro acesso</a>
            </div>
        </div>
        <div class="secure">Ambiente protegido</div>
    </div>
    <script>
        // Se já logado, vai direto ao dashboard do seu cargo
        fetch("/me").then(r => { if (r.ok) location.href = "dashboard.html"; }).catch(() => {});
        function dashboardFor(role) {
            return "dashboard.html"; // dashboard único que se adapta ao cargo
        }
        async function login() {
            const identificador = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const err = document.getElementById('err');
            const btn = document.getElementById('loginBtn');
            err.textContent = "";
            if (!identificador || !senha) { err.textContent = "Informe e-mail e senha para entrar."; return; }
            btn.disabled = true;
            btn.textContent = "Entrando...";
            try {
                const r = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ usuario: identificador, senha })
                });
                const data = await r.json().catch(() => ({}));
                if (r.status === 403 && data.erro === "primeiro_acesso") {
                    sessionStorage.setItem("primeiroAcessoId", data.usuarioId);
                    location.href = "primeiro-acesso.html";
                    return;
                }
                if (!r.ok) {
                    err.textContent = data.erro || "Não foi possível entrar no sistema. Tente novamente.";
                    return;
                }
                sessionStorage.setItem("sentinelaRole", data.role || data.tipo);
                sessionStorage.setItem("sentinelaNome", data.nome || data.usuario);
                location.href = dashboardFor(data.role || data.tipo);
            } catch (e) {
                err.textContent = "Servidor indisponível. Tente novamente em instantes.";
            } finally {
                btn.disabled = false;
                btn.textContent = "Entrar";
            }
        }
        document.getElementById('senha').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
        document.getElementById('toggleSenha').addEventListener('click', () => {
            const senhaField = document.getElementById('senha');
            const isHidden = senhaField.type === 'password';
            senhaField.type = isHidden ? 'text' : 'password';
            document.getElementById('toggleSenha').textContent = isHidden ? 'Ocultar' : 'Mostrar';
        });
    </script>
</body>
</html>
