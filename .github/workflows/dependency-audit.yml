name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate patched lockfile candidate (runner only)
        run: npm audit fix --package-lock-only
      - name: Install root dependencies
        run: npm ci
      - name: Audit root dependencies
        run: npm audit --audit-level=high
      - name: Upload patched lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: sentinela-root-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Install frontend dependencies
        run: npm ci --prefix frontend-v2
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend-v2 --audit-level=high
