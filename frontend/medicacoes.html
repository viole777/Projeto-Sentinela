<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicações</title>
</head>
<body>
<div class="container">
    <h2>Medicações</h2>

    <div id="lista"></div>
</div>
<script>
    fetch("/medicacoes")
    .then(r => r.json())
    .then(data => {
        const div = document.getElementById("lista");
        
        data.forEach(m => {
            div.innerHTML += `
            <div class="card" style="margin-bottom: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 10px;">
                <b>Paciente:</b> ${m.pacienteNome || m.paciente || "-"}<br>
                <b>Diagnóstico:</b> ${m.diagnostico || "-"}<br>
                <b>Medicação:</b> ${m.medicacao || "-"}<br>
                <small>CPF: ${m.pacienteCpf || "-"}</small>
            </div>`;

        });
    })
</script>
</body>
</html>
