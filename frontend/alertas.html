<!DOCTYPE html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="styles.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sentinela — Central de segurança</title></head>
<body>
<script src="layout.js"></script>
<script>
Sentinela.mount("alertas", `
  <div class="page-header">
    <div>
      <div class="eyebrow">Gestão</div>
      <h1>Alertas</h1>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Filtros</div>
    <div class="toolbar" id="filtros">
      <button class="secondary" data-f="">Todos</button>
      <button class="secondary" data-f="CRITICO">Críticos</button>
      <button class="secondary" data-f="ALTO">Altos</button>
      <button class="secondary" data-f="abertos">Abertos</button>
    </div>
  </div>

  <div class="section">
    <div class="panel-title">Ocorrências</div>
    <div id="lista" class="list"></div>
  </div>
`).then(() => {
  let f = "";
  document.querySelectorAll("#filtros button").forEach(b => b.onclick = () => { f = b.dataset.f; carregar(); });
  async function carregar() {
    const q = f === "abertos" ? "?abertos=1" : f ? "?nivel=" + f : "";
    const list = await fetch("/alertas" + q).then(r => r.json());

    const listHtml = list.length
      ? list.map(a => {
          const id = Number(a.id);
          const nivel = String(a.nivel ?? "INFO");
          const classe = nivel === "CRITICO" ? "critica" : nivel === "ALTO" ? "alta" : "info";
          return `
          <div class="list-item">
            <div class="meta-row">
              <span class="badge ${classe}">${Sentinela.escapeHtml(nivel)}</span>
              <span class="meta-chip">${Sentinela.escapeHtml(a.regra)}</span>
            </div>
            <strong>${Sentinela.escapeHtml(a.mensagem)}</strong>
            <small>${Sentinela.escapeHtml(a.pacienteNome || "Sistema")} (${Sentinela.escapeHtml(a.pacienteCpf || "-")}) · ${Sentinela.escapeHtml(new Date(a.quando).toLocaleString("pt-BR"))} · por ${Sentinela.escapeHtml(a.geradoPor)}${a.resolvido ? " · resolvido" : ""}</small>
            ${a.resolvido ? "" : `<div class="row-actions" style="margin-top:8px;"><button class="secondary btnResolver" type="button" data-id="${Number.isSafeInteger(id) && id > 0 ? id : 0}">Revisar</button></div>`}
          </div>`;
        }).join("")
      : '<div class="empty-state">Nenhum alerta cadastrado.</div>';

    document.getElementById("lista").innerHTML = listHtml;
    document.querySelectorAll(".btnResolver").forEach(button => {
      button.addEventListener("click", () => resolver(Number(button.dataset.id)));
    });
  }

  window.resolver = async (id) => { if (!Number.isSafeInteger(id) || id <= 0) return; const r = await fetch("/alertas/" + id + "/resolver", { method: "POST" }); if (!r.ok) { alert("Não foi possível atualizar o alerta."); return; } carregar(); };
  carregar(); setInterval(carregar, 10000);
});
</script>
</body>
</html>
