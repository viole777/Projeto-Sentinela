<!DOCTYPE html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="styles.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sentinela — Configurações</title></head>
<body>
<script src="layout.js"></script>
<script>
Sentinela.mount("config", `
  <div class="page-header">
    <div><div class="eyebrow">Governança</div><h1>Configurações</h1></div>
    <div class="header-meta"><span class="admin-mark">Acesso administrativo</span></div>
  </div>

  <div class="access-note">
    <div class="admin-mark">Admin</div>
    <div><strong>Estas configurações definem o comportamento do sistema.</strong><br>
    <span>Somente o administrador pode alterar regras de segurança, perfis e permissões.</span></div>
  </div>

  <section class="panel" style="margin-top:16px;">
    <div class="panel-title">Safety Engine</div>
    <h3>Regras globais de segurança</h3>
    <p class="dashboard-note">As regras abaixo são aplicadas ao fluxo clínico. Desative uma regra somente quando houver uma decisão administrativa documentada.</p>
    <div id="regras" style="margin-top:8px;"></div>
    <div class="row-actions" style="margin-top:14px;"><button id="salvar">Salvar alterações</button><span id="status" class="dashboard-note"></span></div>
  </section>

  <section class="split">
    <div class="panel">
      <div class="panel-title">Estrutura de acesso</div>
      <div class="cards">
        <div class="card"><div class="dashboard-stat"><strong id="usuarios">—</strong><span>usuários</span></div></div>
        <div class="card"><div class="dashboard-stat"><strong id="roles">—</strong><span>perfis</span></div></div>
        <div class="card"><div class="dashboard-stat"><strong id="permissoes">—</strong><span>permissões</span></div></div>
        <div class="card"><div class="dashboard-stat"><strong id="setores">—</strong><span>setores</span></div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">Privacidade</div>
      <p class="dashboard-note">Ambiente de demonstração com dados fictícios/sintéticos. O acesso é controlado por sessão e RBAC, e as ações administrativas são registradas na auditoria.</p>
    </div>
  </section>

  <section class="split">
    <div class="panel"><div class="panel-title">Perfis</div><div id="rolesList" class="list"></div></div>
    <div class="panel"><div class="panel-title">Usuários cadastrados</div><div id="usersList" class="list"></div></div>
  </section>
`).then(async () => {
  const esc = Sentinela.escapeHtml;
  const ruleNames = {
    alergia:"Alergia × medicação",
    altoRisco:"Medicamentos de alto risco",
    duplicidade:"Duplicidade de medicação",
    dadosIncompletos:"Dados clínicos incompletos",
    sinalCritico:"Sinais clínicos críticos"
  };

  const [rulesRes, usersRes, rolesRes, permissionsRes, sectorsRes] = await Promise.all([
    fetch("/safety/regras"), fetch("/usuarios"), fetch("/roles"), fetch("/permissoes"), fetch("/setores")
  ]);
  if (![rulesRes,usersRes,rolesRes,permissionsRes,sectorsRes].every(r => r.ok)) {
    document.getElementById("status").textContent = "Não foi possível carregar as configurações.";
    return;
  }

  const rules = await rulesRes.json();
  const users = await usersRes.json();
  const roles = await rolesRes.json();
  const permissions = await permissionsRes.json();
  const sectors = await sectorsRes.json();

  document.getElementById("regras").innerHTML = Object.keys(ruleNames).map(key => `
    <div class="rule-row">
      <div class="rule-copy"><strong>${ruleNames[key]}</strong><small>${key}</small></div>
      <label class="switch"><input id="rule-${key}" type="checkbox" ${rules[key] !== false ? "checked" : ""}><span class="switch-track"></span></label>
    </div>
  `).join("");

  document.getElementById("usuarios").textContent = users.length;
  document.getElementById("roles").textContent = roles.length;
  document.getElementById("permissoes").textContent = permissions.length;
  document.getElementById("setores").textContent = sectors.length;

  document.getElementById("rolesList").innerHTML = roles.map(role => `
    <div class="list-item"><strong>${esc(role.name)}</strong><small>${role.name === "admin" ? "Controle total do sistema" : (role.permissions || []).length + " permissões atribuídas"}</small></div>
  `).join("");

  document.getElementById("usersList").innerHTML = users.slice(0,30).map(user => `
    <div class="list-item"><strong>${esc(user.nome || user.usuario)}</strong><small>${esc(user.role)} · ${esc(user.setor || "Sem setor")}</small></div>
  `).join("") || '<div class="empty-state">Nenhum usuário cadastrado.</div>';

  document.getElementById("salvar").onclick = async () => {
    const body = {};
    Object.keys(ruleNames).forEach(key => body[key] = document.getElementById("rule-" + key).checked);
    const res = await fetch("/safety/regras", {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    document.getElementById("status").textContent = res.ok ? "Alterações salvas." : "Não foi possível salvar.";
  };
});
</script>
</body>
</html>
