<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
</head>

<body>
    <div class="container">
        <h2>Sistema Hospitalar</h2>
        <input id="usuario" placeholder="Usuario">
        <input id="senha" type="password" placeholder="Senha">
        <button onclick="login()">Entrar</button>
    </div>
    <script>
        function login() {
            const usuarioEl = document.getElementById('usuario');
            const senhaEl = document.getElementById('senha');

            const payload = {
                usuario: usuarioEl?.value,
                senha: senhaEl?.value
            };

            console.log("login payload", payload);

            if (!payload.usuario || payload.senha === "") {
                alert("Preencha usuário e senha");
                return;
            }

            fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
                .then(async r => {
                    if (!r.ok) {
                        const txt = await r.text().catch(() => '');
                        throw new Error(`HTTP ${r.status} ${txt}`.trim());
                    }
                    return r.json();
                })
                .then(data => {
                    if (data.tipo === "triagem") location.href = "triagem.html";
                    if (data.tipo === "medico") location.href = "medico.html";
                    if (data.tipo === "atendimento") location.href = "atendimento.html";
                })
                .catch(err => {
                    console.error(err);
                    alert("Falha no login: " + err.message);
                });
        }
    </script>
</body>

</html>
