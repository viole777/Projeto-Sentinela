name: Dependency audit remediation

on:
  push:
    paths:
      - ".github/workflows/dependency-audit-remediation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply compatible dependency security updates
        run: |
          npm audit fix --no-fund || true
          npm audit --json > audit-report.json || true
          node -e "const r=require('./audit-report.json'); console.log('AUDIT_SUMMARY', JSON.stringify(r.metadata?.vulnerabilities || {})); for (const [name, item] of Object.entries(r.vulnerabilities || {})) console.log('AUDIT_ITEM', name, item.severity, 'direct='+item.isDirect, 'fixAvailable='+JSON.stringify(item.fixAvailable), 'via='+item.via.map(v=>typeof v==='string'?v:v.title).join(' | '));"

      - name: Commit compatible dependency updates
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: apply compatible dependency security updates"
            git push
          else
            echo "No compatible dependency changes were produced."
          fi

      - name: Run syntax and unit regression tests
        run: |
          npm run lint
          npm run test:unit

      - name: Publish audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinela-dependency-audit
          path: audit-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish concise audit result in repository
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let report = {};
          try { report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8')); } catch (_) {}
          const counts = report.metadata?.vulnerabilities || {};
          const entries = Object.entries(report.vulnerabilities || {});
          const lines = [
            '# Dependency audit result',
            '',
            'Generated automatically by GitHub Actions from the current npm lockfile.',
            '',
            '- Audit source: `npm audit` after compatible `npm audit fix` updates.',
            '- Total: **' + (counts.total ?? entries.length) + '**',
            '- Critical: **' + (counts.critical ?? 'unknown') + '**',
            '- High: **' + (counts.high ?? 'unknown') + '**',
            '- Moderate: **' + (counts.moderate ?? 'unknown') + '**',
            '- Low: **' + (counts.low ?? 'unknown') + '**',
            '',
            '## Findings',
            ''
          ];
          if (!entries.length) lines.push('No vulnerabilities were reported by npm audit.');
          else for (const [name, item] of entries) {
            const via = (item.via || []).map(v => typeof v === 'string' ? v : v.title).join('; ');
            lines.push('- **' + name + '** — ' + item.severity + '; direct dependency: ' + item.isDirect + '; fix available: ' + JSON.stringify(item.fixAvailable) + (via ? '; advisories: ' + via : ''));
          }
          lines.push('', 'This report is a snapshot from the latest workflow run; check the Actions run date before citing it.');
          fs.mkdirSync('docs', { recursive: true });
          fs.writeFileSync('docs/DEPENDENCY_AUDIT.md', lines.join('\n') + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEPENDENCY_AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish dependency audit results"
            git push
          fi

      - name: Fail if high or critical vulnerabilities remain
        run: npm audit --audit-level=high
