<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="stylesheet" href="styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinela AI</title>
</head>
<body>
<script src="layout.js"></script>
<script>
Sentinela.mount("ai", `
  <div class="page-header">
    <div>
      <div class="eyebrow">Cardiologia</div>
      <h1>Resumo clínico assistido</h1>
      <p>Resumo de registros para apoiar a revisão profissional. Não substitui avaliação clínica.</p>
    </div>
  </div>
  <div class="panel">
    <div class="panel-title">Consulta de prontuário</div>
    <form id="ai-form" class="toolbar">
      <label for="cpf">CPF do paciente</label>
      <input id="cpf" name="cpf" autocomplete="off" inputmode="numeric" placeholder="CPF do paciente" required maxlength="18">
      <button id="ai-submit" type="submit">Gerar resumo</button>
    </form>
  </div>
  <section class="section" aria-live="polite" aria-busy="false">
    <div class="panel-title">Resultado</div>
    <div id="out" role="status"><div class="empty-state">Informe o CPF para gerar um resumo.</div></div>
  </section>
`).then(() => {
  const form = document.getElementById("ai-form");
  const cpfInput = document.getElementById("cpf");
  const button = document.getElementById("ai-submit");
  const box = document.getElementById("out");
  const section = box.closest("section");
  const cpfSalvo = sessionStorage.getItem("pacienteCpf");
  if (cpfSalvo) cpfInput.value = cpfSalvo;

  function addText(parent, tag, className, value) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    el.textContent = value == null ? "" : String(value);
    parent.appendChild(el);
    return el;
  }

  function showMessage(message) {
    box.replaceChildren();
    addText(box, "div", "empty-state", message);
  }

  function renderResult(d) {
    box.replaceChildren();
    const card = document.createElement("div");
    card.className = "list-item";
    const meta = document.createElement("div");
    meta.className = "meta-row";
    addText(meta, "strong", "", "Resumo clínico — " + (d.pacienteNome || "Paciente"));
    addText(meta, "span", "meta-chip", d.pacienteCpf || "");
    card.appendChild(meta);

    let resumoExibido = d.resumo || "Resumo não disponível."; try { if (typeof resumoExibido === "string" && resumoExibido.trim().startsWith("{")) { const objeto = JSON.parse(resumoExibido); resumoExibido = objeto.resumo || objeto.summary || objeto.texto || objeto.conclusao || Object.entries(objeto).filter(([k,v]) => k !== "resumo" && v != null && v !== "").map(([k,v]) => k + ": " + (Array.isArray(v) ? v.join("; ") : String(v))).join("\n\n"); } } catch (_) {} addText(card, "p", "clinical-summary", resumoExibido || "Resumo não disponível.");

    function addSection(title, content, items) {
      const section = document.createElement("section");
      section.style.marginTop = "16px";
      addText(section, "h3", "", title);
      if (content) addText(section, "p", "", content);
      if (Array.isArray(items) && items.length) {
        const list = document.createElement("ul");
        items.forEach(item => addText(list, "li", "", item));
        section.appendChild(list);
      }
      if (content || (Array.isArray(items) && items.length)) card.appendChild(section);
    }

    addSection("Avaliação analítica da IA", d.avaliacaoGeral);
    addSection("Pontos de atenção", null, d.pontosAtencao);
    addSection("Informações ausentes", null, d.dadosAusentes);
    addSection("Perguntas para revisão profissional", null, d.perguntasSugeridas);

    const statusRow = document.createElement("div");
    statusRow.style.marginTop = "12px";
    addText(statusRow, "span", d.iaDisponivel === true ? "badge normal" : "badge alta",
      d.iaDisponivel === true ? "Gemini conectado" : "Resumo local");
    if (d.cache === true) addText(statusRow, "small", "", "Resultado reutilizado do cache para economizar tokens.");
    if (d.erroIA) addText(statusRow, "small", "", "IA indisponível: " + d.erroIA);
    card.appendChild(statusRow);

    const inconsistencias = Array.isArray(d.inconsistencias)
      ? d.inconsistencias.filter(item => typeof item === "string")
      : [];
    const safety = document.createElement("div");
    safety.style.marginTop = "12px";
    if (inconsistencias.length) {
      addText(safety, "span", "badge alta", "Atenção — revisar");
      const list = document.createElement("ul");
      inconsistencias.slice(0, 12).forEach(item => addText(list, "li", "", item));
      safety.appendChild(list);
    } else {
      addText(safety, "span", "badge normal", "Nenhuma inconsistência apontada automaticamente");
    }
    card.appendChild(safety);
    addText(card, "small", "", d.aviso || "Apoio à decisão; não substitui avaliação clínica.");
    box.appendChild(card);
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();
    const cpf = cpfInput.value.trim();
    if (!cpf) {
      showMessage("Informe o CPF.");
      cpfInput.focus();
      return;
    }
    button.disabled = true;
    button.textContent = "Gerando resumo…";
    section.setAttribute("aria-busy", "true");
    showMessage("Consultando o prontuário e preparando o resumo…");
    try {
      const response = await fetch("/ia/resumo/" + encodeURIComponent(cpf), {
        headers: { "Accept": "application/json" }
      });
      const data = await response.json().catch(() => ({}));
      if (response.status === 401 || response.status === 403) {
        showMessage("Sua sessão expirou ou seu perfil não tem acesso à IA. Entre novamente com uma conta médica.");
        return;
      }
      if (response.status === 404) {
        showMessage("Paciente não encontrado. Confira o CPF e tente novamente.");
        return;
      }
      if (!response.ok) {
        showMessage("Não foi possível gerar o resumo agora. Tente novamente mais tarde.");
        return;
      }
      renderResult(data);
    } catch (_) {
      showMessage("Falha de conexão. Verifique sua internet e tente novamente.");
    } finally {
      button.disabled = false;
      button.textContent = "Gerar resumo";
      section.setAttribute("aria-busy", "false");
    }
  });
});
</script>
</body>
</html>
