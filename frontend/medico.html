<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medico</title>
</head>
<body>
    <script src="layout.js"></script>
    <script>
        Sentinela.mount("consulta", `
            <div class="container">
                <h2>Painel do Medico</h2>
                <div id="triagens"></div>
                <hr>
                <h3>Consulta + Prescrição <span style="font-weight:400;font-size:12px;">(com Safety Engine antes de confirmar)</span></h3>
                <input id="paciente" placeholder="Paciente">
                <input id="diagnostico" placeholder="Diagnostico">
                <input id="medicacao" placeholder="Medicação (ex: Varfarina 5mg)">
                <input id="obs" placeholder="Observações">

                <div id="safetyBox" style="margin:10px 0;"></div>

                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <button onclick="prever()">Verificar segurança</button>
                    <button onclick="salvar()">Salvar</button>
                    <button onclick="resumoIA()" style="background:rgba(34,197,94,.9);">Resumo IA</button>
                </div>
                <div id="iaBox" style="margin:10px 0;"></div>
                <hr>
                <h3>Alertas</h3>
                <div id="alertasBox"></div>
                <hr>
                <h3>Auditoria recente</h3>
                <div id="audBox"></div>
            </div>
        `).then(() => {
            const diagnostico = document.getElementById('diagnostico');
            const medicacao = document.getElementById('medicacao');
            const obs = document.getElementById('obs');

            function carregar() {
                fetch("/triagem")
                    .then(r => r.json())
                    .then(data => {
                        const div = document.getElementById("triagens");
                        div.innerHTML = "";

                        const rows = Array.isArray(data) ? data : [];

                        div.innerHTML = `
                            <div class="subpanel" style="margin-bottom:14px;">
                                <b>Fila de triagem</b>
                                <span style="color:rgba(229,231,235,.75); margin-left:10px;">(${rows.length} paciente(s))</span>
                            </div>
                            <div style="overflow-x:auto;">
                              <table style="width:100%; border-collapse:separate; border-spacing:0; font-size:14px;">
                                <thead>
                                  <tr>
                                    <th style="text-align:left; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.12); color:rgba(229,231,235,.9);">Paciente</th>
                                    <th style="text-align:left; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.12); color:rgba(229,231,235,.9);">CPF</th>
                                    <th style="text-align:left; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.12); color:rgba(229,231,235,.9);">Temp</th>
                                    <th style="text-align:left; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.12); color:rgba(229,231,235,.9);">Risco</th>
                                    <th style="text-align:left; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.12); color:rgba(229,231,235,.9);">Sintomas</th>
                                    <th style="text-align:left; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.12); color:rgba(229,231,235,.9);">Alergias</th>
                                    <th style="text-align:right; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.12); color:rgba(229,231,235,.9);">Ações</th>
                                  </tr>
                                </thead>
                                <tbody id="triagemRows"></tbody>
                              </table>
                            </div>
                        `;

                        const body = document.getElementById("triagemRows");

                        rows.forEach((t, index) => {
                            const nomePaciente = t.pacienteNome || t.nome || t?.atendimento?.pacienteNome || "Paciente";
                            const atendimento = t.atendimento || {};
                            const imagemRaw = String(atendimento.imagem || '');
                            const imagem = /^(\/uploads\/[a-zA-Z0-9._/-]+|data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+)$/.test(imagemRaw) ? imagemRaw : '';

                            const riscoClasses = { amarelo: 'febre', vermelho: 'alta', verde: 'normal', laranja: 'alta', normal: 'normal' };
                            const riscoClasse = riscoClasses[String(t.risco || '').toLowerCase()] || 'normal';

                            const badgeText = t.risco || '-';
                            const alergiaTxt = t.alergia || 'nenhuma';

                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                              <td style="padding:12px; border-bottom:1px solid rgba(255,255,255,.10);">
                                <div style="display:flex; align-items:center; gap:12px;">
                                  <div style="width:42px; height:42px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10); display:flex; align-items:center; justify-content:center; overflow:hidden;">
                                    ${imagem ? `<img src="${Sentinela.escapeHtml(imagem)}" alt="" style="width:42px; height:42px; object-fit:cover;" />` : `<span style="font-weight:800; color:rgba(229,231,235,.75);">IMG</span>`}
                                  </div>
                                  <div>
                                    <div style="font-weight:800;">${Sentinela.escapeHtml(nomePaciente)}</div>
                                    <div style="font-size:12px; color:rgba(229,231,235,.7); margin-top:2px;">Tipo: ${Sentinela.escapeHtml(atendimento.tipo || '-')}</div>
                                  </div>
                                </div>
                              </td>
                              <td style="padding:12px; border-bottom:1px solid rgba(255,255,255,.10);">${Sentinela.escapeHtml(t.pacienteCpf || '-')}</td>
                              <td style="padding:12px; border-bottom:1px solid rgba(255,255,255,.10);">${Sentinela.escapeHtml(t.temperatura || '-')}°C</td>
                              <td style="padding:12px; border-bottom:1px solid rgba(255,255,255,.10);">
                                <span class="badge ${riscoClasse}" style="white-space:nowrap;">${Sentinela.escapeHtml(badgeText)}</span>
                              </td>
                              <td style="padding:12px; border-bottom:1px solid rgba(255,255,255,.10); max-width:360px;">${Sentinela.escapeHtml(t.sintomas || '-')}</td>
                              <td style="padding:12px; border-bottom:1px solid rgba(255,255,255,.10);">
                                ${(() => {
                                    const has = (t.alergia ?? '').toString().trim().toLowerCase();
                                    const isSim = has && has !== 'nenhuma' && has !== 'nao' && has !== 'não' && has !== '0';
                                    if (!isSim) return `<span style="color:rgba(229,231,235,.7); font-weight:700;">Alergia: Não</span>`;
                                    return `<span class="badge febre" style="background:rgba(239,68,68,.95);">Alergia: Sim</span><div style="margin-top:6px; color:rgba(229,231,235,.85); font-size:12px;">${Sentinela.escapeHtml(t.alergia)}</div>`;
                                })()}
                              </td>
                              <td style="padding:12px; border-bottom:1px solid rgba(255,255,255,.10); text-align:right;">
                                <div style="display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;">
                                  <button style="padding:10px 14px; border:none; border-radius:10px; background:rgba(37,99,235,.95); color:#fff; cursor:pointer;" 
                                    class="btnAtender" data-index="${index}">
                                    Atender
                                  </button>
                                  <button style="padding:10px 14px; border:none; border-radius:10px; background:rgba(239,68,68,.20); border:1px solid rgba(239,68,68,.35); color:#fff; cursor:pointer;"
                                    class="btnApagar" data-index="${index}">
                                    Deletar
                                  </button>
                                </div>
                              </td>
                            `;

                            body.appendChild(tr);
                            tr.querySelector('.btnAtender').addEventListener('click', () => selecionar(t.pacienteId, t.alergia || 'nenhuma', t.pacienteCpf, nomePaciente, t));
                            tr.querySelector('.btnApagar').addEventListener('click', () => apagar(t.id));
                        });
                    });
            }

            function preencherCamposComTriagem(triagem) {
                const nomePaciente = triagem?.pacienteNome || triagem?.nome || "Paciente";
                const pacienteInput = document.getElementById('paciente');
                const diagnosticoInput = document.getElementById('diagnostico');
                const obsInput = document.getElementById('obs');

                if (pacienteInput && nomePaciente) pacienteInput.value = nomePaciente;

                if (diagnosticoInput && !diagnosticoInput.value.trim() && triagem?.sintomas) {
                    diagnosticoInput.value = triagem.sintomas;
                }

                if (obsInput && !obsInput.value.trim()) {
                    const linhaResumo = [
                        triagem?.sintomas ? `Sintomas: ${triagem.sintomas}` : '',
                        triagem?.temperatura != null && triagem?.temperatura !== '' ? `Temperatura: ${triagem.temperatura}°C` : '',
                        triagem?.pas != null || triagem?.pad != null || triagem?.fc != null || triagem?.spo2 != null || triagem?.fr != null
                            ? `Sinais vitais: PA ${triagem?.pas ?? '-'} / ${triagem?.pad ?? '-'}; FC ${triagem?.fc ?? '-'}; SpO2 ${triagem?.spo2 ?? '-'}%; FR ${triagem?.fr ?? '-'}`
                            : '',
                        triagem?.alergia && triagem.alergia !== 'nenhuma' ? `Alergia: ${triagem.alergia}` : '',
                        triagem?.risco ? `Risco: ${triagem.risco}` : ''
                    ].filter(Boolean).join(' • ');

                    if (linhaResumo) {
                        obsInput.value = linhaResumo;
                    }
                }
            }

            function selecionar(pacienteId, alergia, pacienteCpf, nomePaciente, triagem = {}) {
                const nome = nomePaciente || triagem?.pacienteNome || triagem?.nome || 'Paciente';
                document.getElementById("paciente").value = nome;
                sessionStorage.setItem('pacienteId', pacienteId);
                sessionStorage.setItem('pacienteCpf', pacienteCpf);
                sessionStorage.setItem('pacienteNome', nome || '');
                sessionStorage.setItem('triagemAtual', JSON.stringify(triagem || {}));

                preencherCamposComTriagem(triagem);

                if (alergia && alergia !== "nenhuma") {
                    alert("Alerta: paciente possui alergia!\n\nConfirme o atendimento e depois finalize (alta/internação)." );
                }
            }

            async function apagar(triagemId) {
                if (!triagemId) return;
                const ok = confirm('Apagar triagem do paciente?');
                if (!ok) return;

                const r = await fetch(`/triagem?id=${encodeURIComponent(triagemId)}`, { method: 'DELETE' });
                if (!r.ok) {
                    const t = await r.text().catch(() => '');
                    alert('Falha ao apagar: ' + t);
                    return;
                }
                alert('Triagem apagada.');
                location.reload();
            }

            async function prever() {
                const pacienteCpf = sessionStorage.getItem('pacienteCpf');
                if (!pacienteCpf) { alert('Selecione um paciente da fila (Atender).'); return; }
                const box = document.getElementById('safetyBox');
                box.innerHTML = '<p>Verificando...</p>';
                const r = await fetch('/safety/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pacienteCpf, diagnostico: diagnostico.value, medicacao: medicacao.value, obs: obs.value })
                });
                const data = await r.json();
                renderSafety(box, data.achados || []);
            }

            function renderSafety(box, achados) {
                if (!achados.length) {
                    box.innerHTML = '<div class="card" style="border:1px solid rgba(34,197,94,.5);">Tudo certo. Nenhuma inconsistência encontrada nos registros.</div>';
                    return;
                }
                const cor = { CRITICO: '#ef4444', ALTO: '#f59e0b', ATENCAO: '#eab308' };
                box.innerHTML = achados.map(a => `
                    <div class="card" style="border:1px solid ${cor[a.nivel] || '#888'};margin-bottom:8px;">
                        <b>${Sentinela.escapeHtml(a.nivel === 'CRITICO' ? 'Crítico' : 'Atenção')} • ${Sentinela.escapeHtml(a.nivel)} — ${Sentinela.escapeHtml(a.regra)}</b><br>${Sentinela.escapeHtml(a.mensagem)}
                    </div>`).join('') +
                    '<p style="font-size:12px;opacity:.8;">A prescrição requer revisão. A decisão é do profissional.</p>';
            }

            async function resumoIA() {
                const pacienteCpf = sessionStorage.getItem('pacienteCpf');
                if (!pacienteCpf) { alert('Selecione um paciente da fila (Atender).'); return; }
                const box = document.getElementById('iaBox');
                box.innerHTML = '<p>Gerando resumo...</p>';
                const r = await fetch('/ia/resumo/' + encodeURIComponent(pacienteCpf));
                if (!r.ok) { box.innerHTML = '<p>Falha ao gerar resumo.</p>'; return; }
                const d = await r.json();
                box.innerHTML = `<div class="card" style="border:1px solid rgba(34,197,94,.5);">
                    <b>Sentinela AI</b><br><br>${Sentinela.escapeHtml(d.resumo)}<br><br>
                    ${(d.inconsistencias || []).length ? '<b>Possíveis inconsistências:</b><br>• ' + d.inconsistencias.map(Sentinela.escapeHtml).join('<br>• ') : 'Nenhuma inconsistência aparente.'}
                    <br><br><small>Fonte: prontuário do paciente. ${Sentinela.escapeHtml(d.aviso)}</small></div>`;
            }

            async function carregarAlertas() {
                const r = await fetch('/alertas?abertos=1');
                if (!r.ok) return;
                const list = await r.json();
                const box = document.getElementById('alertasBox');
                if (!list.length) { box.innerHTML = '<p>Nenhum alerta aberto.</p>'; return; }
                const cor = { CRITICO: '#ef4444', ALTO: '#f59e0b', ATENCAO: '#eab308', INFORMATIVO: '#2563eb' };
                box.innerHTML = list.slice(0, 10).map(a => `
                    <div class="card" style="border:1px solid ${cor[a.nivel] || '#888'};margin-bottom:8px;">
                        <b>${Sentinela.escapeHtml(a.nivel)}</b> — ${Sentinela.escapeHtml(a.mensagem)}<br>
                        <small>${Sentinela.escapeHtml(a.pacienteNome || '')} (${Sentinela.escapeHtml(a.pacienteCpf || '-')}) • ${Sentinela.escapeHtml(new Date(a.quando).toLocaleString('pt-BR'))} • regra: ${Sentinela.escapeHtml(a.regra)}</small><br>
                        <button style="margin-top:6px;padding:6px 10px;" class="btnResolverAlerta" data-id="${Number(a.id)}">Marcar resolvido</button>
                    </div>`).join('');
                box.querySelectorAll('.btnResolverAlerta').forEach(button => button.addEventListener('click', () => resolverAlerta(Number(button.dataset.id))));
            }

            async function resolverAlerta(id) {
                if (!Number.isSafeInteger(id) || id <= 0) return;
                const response = await fetch('/alertas/' + id + '/resolver', { method: 'POST' });
                if (!response.ok) { alert('Não foi possível atualizar o alerta.'); return; }
                carregarAlertas();
            }

            async function carregarAuditoria() {
                const r = await fetch('/auditoria');
                if (!r.ok) return;
                const list = await r.json();
                document.getElementById('audBox').innerHTML = list.slice(0, 8).map(e =>
                    `<div style="font-size:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);">${new Date(e.quando).toLocaleString('pt-BR')} — <b>${Sentinela.escapeHtml(e.usuario)}</b> (${Sentinela.escapeHtml(e.perfil)}): ${Sentinela.escapeHtml(e.acao)}</div>`
                ).join('') || '<p>Sem eventos.</p>';
            }

            function salvar() {
                const pacienteId = sessionStorage.getItem('pacienteId');
                const pacienteCpf = sessionStorage.getItem('pacienteCpf');

                fetch("/consulta", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        pacienteId: pacienteId ? Number(pacienteId) : undefined,
                        pacienteCpf: pacienteCpf,
                        diagnostico: diagnostico.value,
                        medicacao: medicacao.value,
                        obs: obs.value
                    })
                })
                    .then(r => r.json())
                    .then((data) => {
                        if (data && data.alertasGerados && data.alertasGerados.length) {
                            const crit = data.alertasGerados.some(a => a.nivel === 'CRITICO');
                            alert((crit ? "SAFETY ENGINE — REVISÃO OBRIGATÓRIA\n\n" : "Safety Engine encontrou pontos de atenção\n\n") + data.alertasGerados.map(a => `• [${a.nivel}] ${a.mensagem}`).join("\n") + "\n\nConsulta salva. Finalize o atendimento.");
                        } else {
                            alert("Consulta salva! Finalize o atendimento.");
                        }
                        location.href = 'finalizar_atendimento.html';
                    })
                    .catch(err => {
                        console.error(err);
                        alert('Erro ao salvar consulta: ' + err.message);
                    });
            }

            window.selecionar = selecionar;
            window.apagar = apagar;
            window.prever = prever;
            window.renderSafety = renderSafety;
            window.resumoIA = resumoIA;
            window.carregarAlertas = carregarAlertas;
            window.resolverAlerta = resolverAlerta;
            window.carregarAuditoria = carregarAuditoria;
            window.salvar = salvar;

            carregar();
            carregarAlertas();
            carregarAuditoria();
            setInterval(carregarAlertas, 10000);
        });
    </script>
</body>
</html>
