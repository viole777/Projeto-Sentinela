<!DOCTYPE html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="styles.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sentinela — Safety Engine</title></head>
<body>
<script src="layout.js"></script>
<script>
Sentinela.mount("safety", `
  <div class="page-header">
    <div>
      <div class="eyebrow">Segurança</div>
      <h1>Safety Engine</h1>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Regras ativas</div>
    <div id="regras"></div>
    <div class="row-actions" style="margin-top:12px;">
      <button id="salvarRegras">Salvar regras</button>
    </div>
  </div>

  <div class="section">
    <div class="panel-title">Ocorrências em aberto</div>
    <div id="hist" class="list"></div>
  </div>
`).then(async () => {
  const r = await fetch("/safety/regras").then(r => r.json());
  const rules = (r && typeof r === "object") ? r : {};
  const ruleKeys = Object.keys(rules).filter(k => k !== "altoRiscoLista");

  const regrasEl = document.getElementById("regras");
  function renderRules() {
    regrasEl.innerHTML = ruleKeys.map((key) => `
      <div class="list-item" style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
        <span>${key}</span>
        <input id="rule-${key}" type="checkbox" ${rules[key] ? "checked" : ""}>
      </div>
    `).join("") || "<div class=\"empty-state\">Sem regras configuradas.</div>";
  }

  renderRules();

  document.getElementById("salvarRegras").onclick = async () => {
    const payload = {};
    ruleKeys.forEach((key) => {
      payload[key] = document.getElementById(`rule-${key}`).checked;
    });

    const res = await fetch("/safety/regras", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      alert("Falha ao salvar regras do Safety Engine.");
      return;
    }

    alert("Regras atualizadas com sucesso.");
    const updated = await fetch("/safety/regras").then(r => r.json());
    Object.assign(rules, updated || {});
    renderRules();
  };

  const h = await fetch("/alertas?abertos=1").then(r => r.json());
  document.getElementById("hist").innerHTML = (h || []).slice(0, 20).map(a => `
    <div class="list-item">
      <div class="meta-row">
        <span class="badge ${a.nivel === "CRITICO" ? "critica" : a.nivel === "ALTO" ? "alta" : "info"}">${a.nivel}</span>
        <span class="meta-chip">${a.regra}</span>
      </div>
      <strong>${a.mensagem}</strong>
      <small>${a.pacienteNome || ""} · ${a.pacienteCpf || "-"}</small>
    </div>
  `).join("") || "<div class=\"empty-state\">Sem ocorrências em aberto.</div>";
});
</script>
</body>
</html>
