name: Sentinela CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentinela_test
      PGSSL: disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinela_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentinela_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check backend syntax
        run: npm run lint

      - name: Create schema and import demo fixtures
        run: npm run db:migrate

      - name: Start application
        run: |
          npm start > /tmp/sentinela.log 2>&1 &
          echo $! > /tmp/sentinela.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sentinela.log
          exit 1

      - name: Run smoke tests against PostgreSQL
        run: |
          if ! npm test; then
            cat /tmp/sentinela.log
            exit 1
          fi

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/sentinela.pid ]; then
            kill "$(cat /tmp/sentinela.pid)" 2>/dev/null || true
          fi
