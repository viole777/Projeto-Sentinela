<!DOCTYPE html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="styles.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sentinela — Dashboard</title></head>
<body>
<script src="layout.js"></script>
<script>
Sentinela.mount("dashboard", `
  <section class="dashboard-page">
  <div class="page-header">
    <div>
      <div class="eyebrow">Painel operacional</div>
      <h1 id="saudacao">Dashboard</h1>
    </div>
    <div class="header-meta" id="unidade"></div>
  </div>

  <div class="panel">
    <div class="panel-title">Indicadores</div>
    <div class="panel-grid" id="kpis"></div>
  </div>

  <div class="split">
    <div class="panel">
      <div class="panel-title">Atendimento de hoje</div>
      <div id="agenda" class="list"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Alertas</div>
      <div id="alertas" class="list"></div>
    </div>
  </div>

  <div class="split">
    <div class="panel">
      <div class="panel-title">Fila</div>
      <div id="fila"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Atividade recente</div>
      <div id="ativ" class="list"></div>
    </div>
  </div>
  </section>
`).then(async () => {
  const d = await fetch("/dashboard").then(r => r.json());
  const hora = new Date().getHours();
  const turno = hora < 12 ? "Bom dia" : hora < 18 ? "Boa tarde" : "Boa noite";

  document.getElementById("saudacao").textContent = `${turno}, ${d.nome}.`;
  document.getElementById("unidade").innerHTML = `
    <div class="meta-row">
      <span class="meta-chip">Unidade Cardiológica</span>
      <span>${new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" })}</span>
      <span class="meta-chip">${(d.role || "").toUpperCase()}</span>
    </div>
  `;

  const c = d.cards || {};
  const kpis = [];
  if (c.pacientes != null) kpis.push([c.pacientes, "Pacientes"]);
  if (c.espera != null) kpis.push([c.espera, "Em espera"]);
  if (c.alertas != null) kpis.push([c.alertas, "Alertas"]);
  if (c.leitos != null) kpis.push([c.leitos, "Leitos livres"]);
  if (c.consultas != null) kpis.push([c.consultas, "Consultas hoje"]);
  if (c.exames != null) kpis.push([c.exames, "Exames pendentes"]);
  if (c.presc != null) kpis.push([c.presc, "Prescrições"]);
  if (c.estoque != null) kpis.push([c.estoque, "Estoque crítico"]);

  document.getElementById("kpis").innerHTML = kpis.map(([value, label]) => `
    <div class="kpi">
      <b>${value}</b>
      <span>${label}</span>
    </div>
  `).join("");

  const fila = d.fila || d.proximos || [];
  const agenda = fila.slice(0, 6);
  document.getElementById("agenda").innerHTML = agenda.length
    ? agenda.map((p, idx) => `
        <div class="list-item">
          <strong>${String((idx + 1) * 30).padStart(2, "0")}:00 — ${p.nome}</strong>
          <small>${p.risco || "Normal"} · ${p.status || "Aguardando"}</small>
        </div>
      `).join("")
    : '<div class="empty-state">Nenhum atendimento agendado.</div>';

  const al = d.alertas || [];
  document.getElementById("alertas").innerHTML = al.length
    ? al.slice(0, 4).map(a => `
        <div class="list-item">
          <div class="meta-row">
            <span class="badge ${a.nivel === 'crítico' ? 'critica' : a.nivel === 'alto' ? 'alta' : 'info'}">${a.nivel || 'Informação'}</span>
          </div>
          <strong>${a.mensagem}</strong>
          <small>${a.pacienteNome || "Sistema"}</small>
        </div>
      `).join("")
    : '<div class="empty-state">Nenhuma ocorrência pendente.</div>';

  document.getElementById("fila").innerHTML = fila.length
    ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Paciente</th><th>Prioridade</th><th>Espera</th><th>Status</th></tr></thead><tbody>${fila.slice(0, 6).map(p => `
        <tr>
          <td>${p.nome}</td>
          <td><span class="badge ${p.risco === 'vermelho' ? 'alta' : p.risco === 'amarelo' ? 'febre' : 'normal'}">${p.risco || 'Normal'}</span></td>
          <td>${p.espera || '-'}</td>
          <td>${p.status || 'Aguardando'}</td>
        </tr>
      `).join("")}</tbody></table></div>`
    : '<div class="empty-state">Nenhum paciente aguardando.</div>';

  const atv = d.atividade || [];
  document.getElementById("ativ").innerHTML = atv.length
    ? atv.slice(0, 6).map(e => `
        <div class="list-item">
          <strong>${e.acao}</strong>
          <small>${(e.quando || '').slice(11, 16)} · ${e.usuario}</small>
        </div>
      `).join("")
    : '<div class="empty-state">Sem atividade recente.</div>';
});
</script>
</body>
</html>
