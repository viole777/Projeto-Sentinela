name: Sentinela CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentinela_test
      PGSSL: disable
      TEST_ADMIN_PASSWORD: 'sentinela-ci-only-2026-randomized-test-passphrase'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinela_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentinela_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check backend syntax
        run: npm run lint

      - name: Create schema and import demo fixtures
        run: npm run db:migrate

      - name: Provision isolated CI admin account
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const { Pool } = require('pg');
          const salt = crypto.randomBytes(16).toString('hex');
          const hash = crypto.scryptSync(process.env.TEST_ADMIN_PASSWORD, salt, 64).toString('hex');
          const passwordHash = `scrypt${salt}${hash}`;
          (async () => {
            const pool = new Pool({ connectionString: process.env.DATABASE_URL, ssl: false });
            const role = await pool.query("SELECT id FROM roles WHERE name = 'admin'");
            await pool.query(
              `INSERT INTO users (username, email, name, password_hash, role, role_id, must_change_password, theme)
               VALUES ('ci-admin', 'ci-admin@sentinela.invalid', 'CI Admin', $1, 'admin', $2, false, 'light')
               ON CONFLICT (username) DO UPDATE SET password_hash = EXCLUDED.password_hash, role_id = EXCLUDED.role_id`,
              [passwordHash, role.rows[0]?.id || null]
            );
            await pool.end();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Start application
        run: |
          npm start > /tmp/sentinela.log 2>&1 &
          echo $! > /tmp/sentinela.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sentinela.log
          exit 1

      - name: Run smoke tests against PostgreSQL
        run: |
          if ! npm test; then
            cat /tmp/sentinela.log
            exit 1
          fi

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/sentinela.pid ]; then
            kill "$(cat /tmp/sentinela.pid)" 2>/dev/null || true
          fi
