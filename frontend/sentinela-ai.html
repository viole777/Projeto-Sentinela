<!DOCTYPE html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="styles.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sentinela AI</title></head>
<body>
<script src="layout.js"></script>
<script>
Sentinela.mount("ai", `
  <div class="page-header">
    <div>
      <div class="eyebrow">Cardiologia</div>
      <h1>Resumo clínico assistido</h1>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Consulta de prontuário</div>
    <div class="toolbar">
      <input id="cpf" placeholder="CPF do paciente">
      <button onclick="resumir()">Gerar resumo</button>
    </div>
  </div>

  <div class="section">
    <div class="panel-title">Resultado</div>
    <div id="out"></div>
  </div>
`).then(() => {
  const cpf = sessionStorage.getItem("pacienteCpf");
  if (cpf) document.getElementById("cpf").value = cpf;

  window.resumir = async () => {
    const c = document.getElementById("cpf").value.trim();
    if (!c) return alert("Informe o CPF.");

    const box = document.getElementById("out");
    box.innerHTML = '<div class="empty-state">Gerando resumo...</div>';

    const r = await fetch("/ia/resumo/" + encodeURIComponent(c));
    if (!r.ok) { box.innerHTML = '<div class="empty-state">Paciente não encontrado.</div>'; return; }

    const d = await r.json();

    const statusIA =
      d.iaDisponivel === true
        ? `
            <span class="badge normal">
              ● Gemini conectado
            </span>
          `
        : `
            <span class="badge alta">
              ⚠ Resumo local
            </span>
          `;

    const cacheInfo =
      d.cache === true
        ? `
            <small
              style="
                display:block;
                margin-top:6px;
                opacity:.7;
              "
            >
              Resultado reutilizado do cache
              para economizar tokens.
            </small>
          `
        : "";

    const erroIA =
      d.erroIA
        ? `
            <small
              style="
                display:block;
                margin-top:6px;
                opacity:.75;
              "
            >
              Motivo: ${d.erroIA}
            </small>
          `
        : "";

    box.innerHTML = `
      <div class="list-item">
        <div class="meta-row">
          <strong>Resumo clínico — ${d.pacienteNome}</strong>
          <span class="meta-chip">${d.pacienteCpf}</span>
        </div>
        <div style="margin-top:10px;">
          ${d.resumo}
        </div>

        <div style="margin-top:12px;">
          ${statusIA}
          ${cacheInfo}
          ${erroIA}
        </div>
        <div style="margin-top:12px;">
          ${(d.inconsistencias || []).length
            ? '<div class="meta-row" style="margin-bottom:8px;"><span class="badge alta">Atenção</span></div>' + (d.inconsistencias || []).map(i => `<div>• ${i}</div>`).join("")
            : '<div class="meta-row"><span class="badge normal">Sem inconsistências</span></div>'}
        </div>
        <small style="display:block;margin-top:10px;">${d.aviso}</small>
      </div>
    `;
  };
});
</script>
</body>
</html>
