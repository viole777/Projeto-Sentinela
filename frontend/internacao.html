<!DOCTYPE html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="styles.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sentinela - Internacao</title></head>
<body>
<script src="layout.js"></script>
<script>
Sentinela.mount("internacao", `
  <h2>Internacao - Ala Cardiologia</h2>
  <div class="cards" id="mapa"></div>
  <div class="card"><h3>Internar paciente</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <input id="cpf" placeholder="CPF" style="max-width:180px;"><input id="leito" placeholder="Leito (ex: 102)" style="max-width:140px;">
      <input id="motivo" placeholder="Motivo..."><button onclick="internar()">Confirmar internacao</button>
    </div></div>
`).then(() => {
  window.internar = async () => {
    const r = await fetch("/internacoes", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pacienteCpf: document.getElementById("cpf").value, leito: document.getElementById("leito").value, motivo: document.getElementById("motivo").value }) });
    if (!r.ok) { alert("Falha: " + await r.text()); return; }
    carregar();
  };
  async function carregar() {
    const leitos = await fetch("/leitos").then(r => r.json());
    document.getElementById("mapa").innerHTML = leitos.map(l =>
      '<div class="card kpi"><b>[' + l.id + ']</b>' + (l.status === "livre" ? "LIVRE" : (l.pacienteNome || "Ocupado")) + '<br><small>' + (l.ala || "") + '</small></div>').join("");
  }
  carregar();
});
</script>
</body>
</html>
